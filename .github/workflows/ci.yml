name: CI

# main 以外のブランチと、main 宛のプルリクエストを検証します。
# デプロイはしません（deploy.yml の担当）。
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: テスト
        run: npm test

      # build は typecheck を含みます（package.json 参照）。
      - name: 型チェックとビルド
        run: npm run build

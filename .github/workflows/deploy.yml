name: Deploy

# main への push で本番へ出ます。手動実行も可能です。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に走らせない。後から来た push が先の deploy を追い越さないようにします。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # setup-node の cache: npm が持つのは ~/.npm（tarball 置き場）だけで、
      # node_modules ではありません。それが当たっていても npm ci は毎回
      # node_modules を消して 346MB を展開し直すので、下で node_modules 自体を
      # キャッシュし、当たったら npm ci を飛ばします。cache: npm はミス時の
      # 保険として残しています。
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # restore-keys は使いません。部分一致で古い node_modules を拾うと、
      # 依存を足した回だけ静かに壊れます。キャッシュを疑ったら key の先頭の
      # v1- を v2- に上げれば全部作り直せます。
      # cache だけ v4 なのは、確実に存在する版を使うためです。もし Annotations の
      # Node 20 警告がこのアクションを名指ししていたら v5 へ上げてください。
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: v1-node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci --prefer-offline --no-audit --fund=false
        if: steps.node-modules.outputs.cache-hit != 'true'

      # デプロイ前に落とせるものはここで落とします。壊れたものを本番に出すより、
      # デプロイしないほうがましです。
      - name: テスト
        run: npm test

      # build は typecheck を含みます（package.json 参照）。
      - name: 型チェックとビルド
        run: npm run build

      # 以下2ステップは cloudflare/wrangler-action ではなく npx で直接呼びます。
      # アクションはデプロイ時に自分で wrangler を取りに行くため、上の npm ci が
      # 入れた固定版（package.json の wrangler）ではなく別の版で本番に出る可能性が
      # あります。テストを通したのと同じ版でデプロイするほうが大事です。副次的に、
      # デプロイ経路から分単位で揺れる npm インストールが2回消えます。
      # 認証は wrangler が CLOUDFLARE_API_TOKEN を直接読むので、扱いは同じです。

      # マイグレーションは CREATE TABLE IF NOT EXISTS で冪等、かつ wrangler が
      # 適用済みのものを飛ばすため、毎回実行しても安全です。スキーマ変更を
      # 手で流し忘れてデプロイが壊れるほうが起きやすい事故です。
      - name: D1 マイグレーション適用
        run: npx wrangler d1 migrations apply drink-status --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ビルド済みの dist/client をそのまま使うので、ここでは deploy だけ。
      - name: デプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

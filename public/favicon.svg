<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="4Fドリンク速報">
  <!--
    A single coffee bean on the brand terracotta.

    One shape, no detail that dies at 16px, and a filled background so the mark
    holds its own against either a light or a dark browser chrome. The split is
    knocked out in the background colour, the same trick the subject chips use.
  -->
  <rect width="32" height="32" rx="7.5" fill="#b4552d"/>
  <g transform="rotate(-32 16 16)">
    <ellipse cx="16" cy="16" rx="7.8" ry="11.2" fill="#f9f0dd"/>
    <path d="M16 5.6c-2.9 4.6-2.9 16.2 0 20.8"
          fill="none" stroke="#b4552d" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>

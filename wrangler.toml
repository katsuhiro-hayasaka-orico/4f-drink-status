name = "yonf-drink-status"
main = "worker/index.ts"
compatibility_date = "2024-12-18"

# 秘密情報ではありませんが、複数アカウントに所属している場合に
# wrangler がデプロイ先を取り違えないよう明示しています。
account_id = "78b98bed51f7cd2c9dec887cb1fe7750"

# The Vite build output is served straight from the Worker; anything under
# /api is handled in code before assets are consulted.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "drink-status"
# Replace with the id printed by `wrangler d1 create drink-status`.
database_id = "db0c3937-49ef-4fcc-ac37-246110b2fe7c"
migrations_dir = "migrations"

[observability]
enabled = true

# SESSION_SECRET signs the anonymous device cookie. Set it for real
# deployments with:  wrangler secret put SESSION_SECRET
# Local `wrangler dev` falls back to a fixed development value.
[vars]
ENVIRONMENT = "production"
